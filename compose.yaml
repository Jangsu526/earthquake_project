services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      FASTAPI_API_KEY: ${FASTAPI_API_KEY:?FASTAPI_API_KEY must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: earthquake_ai
      POSTGRES_USER: earthquake_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthquake_app -d earthquake_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: